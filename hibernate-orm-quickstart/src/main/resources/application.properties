quarkus.datasource.db-kind=postgresql
quarkus.datasource.credentials-provider = fruits1cred
quarkus.datasource.credentials-provider-name = fruits1cred
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost/hibernate_orm_test_1
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

quarkus.datasource.second.db-kind=postgresql
quarkus.datasource.second.credentials-provider = fruits2cred
quarkus.datasource.second.credentials-provider-name = fruits2cred
quarkus.datasource.second.jdbc.url=jdbc:postgresql://localhost:5433/hibernate_orm_test_2
quarkus.datasource.second.jdbc.max-size=8
quarkus.datasource.second.jdbc.min-size=2

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.packages=org.acme.hibernate.orm.fruit

quarkus.hibernate-orm.second.database.generation=drop-and-create
quarkus.hibernate-orm.second.datasource=second
quarkus.hibernate-orm.second.log.sql=true
quarkus.hibernate-orm.second.sql-load-script=import2.sql
quarkus.hibernate-orm.second.packages=org.acme.hibernate.orm.fruit2
